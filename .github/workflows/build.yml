name: build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "packaging/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/build.yml"

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --group dev
      - run: uv run ruff check src tests packaging
      - run: uv run mypy src tests
      - run: uv run pytest -q -p no:cacheprovider

  windows:
    needs: quality
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --group build

      - uses: actions/cache@v4
        with:
          path: build/sidecar-cache
          key: sidecars-windows-x86_64-${{ hashFiles('packaging/sidecars.lock.json') }}

      - name: Build standalone bundle
        run: uv run --group build python packaging/build.py

      - uses: actions/upload-artifact@v4
        with:
          name: yt-paw-windows-x86_64
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  linux:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --group build

      - uses: actions/cache@v4
        with:
          path: build/sidecar-cache
          key: sidecars-linux-x86_64-${{ hashFiles('packaging/sidecars.lock.json') }}

      - name: Build standalone bundle
        run: uv run --group build python packaging/build.py

      - uses: actions/upload-artifact@v4
        with:
          name: yt-paw-linux-x86_64
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.zip
            artifacts/*.tar.gz
            artifacts/*.sha256
